<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
    .bg { fill: none; }
    .circle-cyan { fill: #0099cc; mix-blend-mode: multiply; opacity: 0.85; }
    .circle-magenta { fill: #e6007e; mix-blend-mode: multiply; opacity: 0.85; }
    .circle-yellow { fill: #ffcc00; mix-blend-mode: multiply; opacity: 0.85; }
    .border { fill: none; stroke: #0a192f; stroke-width: 3.2; }
  </style>

  <!-- Outer Ring -->
  <circle cx="64.0" cy="64.0" r="58.88" class="border" />

  <!-- Overlapping Circles (Subtractive Color Mixing) -->
  <g>
    <!-- Cyan (Top Left) -->
    <circle cx="52.48" cy="52.48" r="32.0" fill="#009AEC" opacity="0.85" style="mix-blend-mode: multiply;" />
    <!-- Magenta (Top Right) -->
    <circle cx="75.52" cy="52.48" r="32.0" fill="#E6007E" opacity="0.85" style="mix-blend-mode: multiply;" />
    <!-- Yellow (Bottom Center) -->
    <circle cx="64.0" cy="74.24" r="32.0" fill="#FFCC00" opacity="0.85" style="mix-blend-mode: multiply;" />
  </g>
</svg>