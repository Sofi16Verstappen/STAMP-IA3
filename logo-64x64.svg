<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .bg { fill: none; }
    .circle-cyan { fill: #0099cc; mix-blend-mode: multiply; opacity: 0.85; }
    .circle-magenta { fill: #e6007e; mix-blend-mode: multiply; opacity: 0.85; }
    .circle-yellow { fill: #ffcc00; mix-blend-mode: multiply; opacity: 0.85; }
    .border { fill: none; stroke: #0a192f; stroke-width: 1.6; }
  </style>

  <!-- Outer Ring -->
  <circle cx="32.0" cy="32.0" r="29.44" class="border" />

  <!-- Overlapping Circles (Subtractive Color Mixing) -->
  <g>
    <!-- Cyan (Top Left) -->
    <circle cx="26.24" cy="26.24" r="16.0" fill="#009AEC" opacity="0.85" style="mix-blend-mode: multiply;" />
    <!-- Magenta (Top Right) -->
    <circle cx="37.76" cy="26.24" r="16.0" fill="#E6007E" opacity="0.85" style="mix-blend-mode: multiply;" />
    <!-- Yellow (Bottom Center) -->
    <circle cx="32.0" cy="37.12" r="16.0" fill="#FFCC00" opacity="0.85" style="mix-blend-mode: multiply;" />
  </g>
</svg>