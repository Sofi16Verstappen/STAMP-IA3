<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    .bg { fill: none; }
    .circle-cyan { fill: #0099cc; mix-blend-mode: multiply; opacity: 0.85; }
    .circle-magenta { fill: #e6007e; mix-blend-mode: multiply; opacity: 0.85; }
    .circle-yellow { fill: #ffcc00; mix-blend-mode: multiply; opacity: 0.85; }
    .border { fill: none; stroke: #0a192f; stroke-width: 12.8; }
  </style>

  <!-- Outer Ring -->
  <circle cx="256.0" cy="256.0" r="235.52" class="border" />

  <!-- Overlapping Circles (Subtractive Color Mixing) -->
  <g>
    <!-- Cyan (Top Left) -->
    <circle cx="209.92" cy="209.92" r="128.0" fill="#009AEC" opacity="0.85" style="mix-blend-mode: multiply;" />
    <!-- Magenta (Top Right) -->
    <circle cx="302.08" cy="209.92" r="128.0" fill="#E6007E" opacity="0.85" style="mix-blend-mode: multiply;" />
    <!-- Yellow (Bottom Center) -->
    <circle cx="256.0" cy="296.96" r="128.0" fill="#FFCC00" opacity="0.85" style="mix-blend-mode: multiply;" />
  </g>
</svg>