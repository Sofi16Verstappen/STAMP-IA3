<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <style>
    .bg { fill: none; }
    .circle-cyan { fill: #0099cc; mix-blend-mode: multiply; opacity: 0.85; }
    .circle-magenta { fill: #e6007e; mix-blend-mode: multiply; opacity: 0.85; }
    .circle-yellow { fill: #ffcc00; mix-blend-mode: multiply; opacity: 0.85; }
    .border { fill: none; stroke: #0a192f; stroke-width: 0.4; }
  </style>

  <!-- Outer Ring -->
  <circle cx="8.0" cy="8.0" r="7.36" class="border" />

  <!-- Overlapping Circles (Subtractive Color Mixing) -->
  <g>
    <!-- Cyan (Top Left) -->
    <circle cx="6.56" cy="6.56" r="4.0" fill="#009AEC" opacity="0.85" style="mix-blend-mode: multiply;" />
    <!-- Magenta (Top Right) -->
    <circle cx="9.44" cy="6.56" r="4.0" fill="#E6007E" opacity="0.85" style="mix-blend-mode: multiply;" />
    <!-- Yellow (Bottom Center) -->
    <circle cx="8.0" cy="9.28" r="4.0" fill="#FFCC00" opacity="0.85" style="mix-blend-mode: multiply;" />
  </g>
</svg>